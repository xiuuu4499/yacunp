[project]
name = "comfyui-yacunp"
version = "0.1.0"
description = "YACUNP — Yet Another ComfyUI Node Pack. Utility nodes for building and manipulating key/value pairs, dictionaries, and JSON."
license = "MIT"
requires-python = ">=3.10"
readme = "README.md"

[project.urls]
Repository = "https://github.com/xiuuu4499/yacunp"

[project.optional-dependencies]
# The Local LLM (llama.cpp) nodes need llama-cpp-python. Install a vision-capable
# build for multimodal (mmproj) models. LM Studio nodes use only the standard
# library. Backends are imported lazily, so the pack loads without these.
llama = ["llama-cpp-python>=0.2.90"]

[tool.comfy]
# Replace with your ComfyUI registry publisher id before publishing.
PublisherId = "REPLACE_WITH_PUBLISHER_ID"
DisplayName = "YACUNP"
Icon = ""

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
